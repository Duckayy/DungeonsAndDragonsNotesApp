    <main>
        <h1>Campaigns</h1>
        <div id="campaign-list"></div>
        <button id="toggle-new-campaign-btn">+ Create New Campaign</button>
        <!-- Hidden by default via the "hidden" attribute; JS toggles this -->
        <form id="new-campaign-form" hidden>
            <label for="campaign-name">Name</label>
            <input type="text" id="campaign-name" name="campaign-name">

            <label for="campaign-description">Description</label>
            <textarea name="campaign-description" id="campaign-description"></textarea>

            <button type="submit">Save</button>
        </form>
    </main>

    <!-- script tags here -->
