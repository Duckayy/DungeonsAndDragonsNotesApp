<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Sessions</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- page content -->
    <nav>
        <!-- your nav links here -->
         <a href="campaigns.html">Home</a>
         <a href="campaigns.html">Campaigns</a>
         <a href="sessions.html">Sessions</a>
         <a href="world.html">World</a>
         <a href="characters.html">Characters</a>
         <span id="nav-breadcrumb"></span>
    </nav>

    <main>
        <!--Session cards here -->
         <h1>Sessions</h1>
         <div id="session-list"></div>
         <button id="toggle-new-session-btn">+ Create New Session</button>
         <!-- Hidden by default via the "hidden" attribute; JS toggles this -->
         <form id="new-session-form" hidden>
            <label for="title">Title</label>
            <input type="text" id="title" name="title">

            <label for="date">Date</label>
            <input type="date" id="date" name="date">

            <label for="inGameDate">In-Game Date</label>
            <input type="text" id="inGameDate" name="inGameDate">

            <label for="summary">Summary</label>
            <textarea name="summary" id="summary"></textarea>

            <label for="tags">Tags (comma-separated)</label>
            <input type="text" id="tags" name="tags">

            <button type="submit">Save</button>
         </form>

    </main>

    <!-- script tags here -->
    <script src="../js/storage.js"></script>
    <script src="../js/sessions.js"></script>
    <script src="../js/nav.js"></script>
</body>
</html>
